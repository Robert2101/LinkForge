services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: linkforge-backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=development
      - PORT=5001
      - BASE_URL=http://localhost:5001
      - CORS_ORIGIN=http://localhost:5173
      - DATABASE_URL=postgresql://linkforge:forgepass@postgres:5432/linkforge_db
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=linkforge-super-secret-jwt-access-key-32chars!
      - JWT_REFRESH_SECRET=linkforge-super-secret-jwt-refresh-key-32chars!
      - COOKIE_SECRET=linkforge-super-secret-cookie-key-min16!
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: linkforge-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=linkforge
      - POSTGRES_PASSWORD=forgepass
      - POSTGRES_DB=linkforge_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkforge -d linkforge_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: linkforge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
