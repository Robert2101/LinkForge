name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The workflow only needs to read the code. Nothing here can push or publish.
permissions:
  contents: read

# A newer push to the same branch cancels the run that is now out of date.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, audit, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # The tests run against a real Postgres and a real Redis, the same
    # versions as production, not mocks.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: linkforge
          POSTGRES_PASSWORD: linkforge
          POSTGRES_DB: linkforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U linkforge -d linkforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      BASE_URL: http://localhost:5001
      DATABASE_URL: postgresql://linkforge:linkforge@localhost:5432/linkforge_test
      REDIS_URL: redis://localhost:6379/1
      TRUST_PROXY: 1

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check production dependencies for known vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Apply database migrations
        run: npm run test:migrate
      - name: Run unit and integration tests
        run: npm test

  frontend:
    name: Frontend (lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check production dependencies for known vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Run unit tests
        run: npm test
      - name: Build
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
